# Local PostgreSQL only (PRD §12). Start with: docker compose up -d db
# Matches the credentials in .env.example.
# Host port 5433 to avoid clashing with an existing local Postgres on 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: coaching-ngj-db
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching_ngj
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching_ngj"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
